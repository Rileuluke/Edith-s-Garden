<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edith's Garden</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --font-title: 'Cinzel', serif;
            --font-cursive: 'Great Vibes', cursive;
            --font-body: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-body);
            overflow-x: hidden;
            background: #081c15;
            color: #f8fafc;
            user-select: none;
        }

        .title-font { font-family: var(--font-title); }
        .cursive-font { font-family: var(--font-cursive); }

        /* Atmospheric Gradient Background: Park at dusk with emerald greens and mystical purples */
        .bg-park-gradient {
            background: radial-gradient(circle at 50% 30%, #3b0764 0%, #1e1b4b 35%, #064e3b 75%, #022c22 100%);
        }

        /* Gentle Swaying Animations for Flowers */
        @keyframes swayLeft {
            0%, 100% { transform: rotate(-1.5deg); }
            50% { transform: rotate(2deg); }
        }
        @keyframes swayCenter {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(-1deg) scale(1.02); }
        }
        @keyframes swayRight {
            0%, 100% { transform: rotate(1.5deg); }
            50% { transform: rotate(-2deg); }
        }

        .tulip-sway-left { animation: swayLeft 6s ease-in-out infinite; transform-origin: bottom center; }
        .tulip-sway-center { animation: swayCenter 5.5s ease-in-out infinite; transform-origin: bottom center; }
        .tulip-sway-right { animation: swayRight 6.5s ease-in-out infinite; transform-origin: bottom center; }

        /* Glowing Effects */
        .glow-burgundy { filter: drop-shadow(0 0 22px rgba(153, 27, 27, 0.75)) drop-shadow(0 0 40px rgba(88, 28, 135, 0.55)); }
        .glow-gradient-left { filter: drop-shadow(0 0 18px rgba(236, 72, 153, 0.6)) drop-shadow(0 0 30px rgba(168, 85, 247, 0.4)); }
        .glow-gradient-right { filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.6)) drop-shadow(0 0 30px rgba(239, 68, 68, 0.4)); }

        /* Glassmorphism Modal Cards and Controls */
        .glass-card {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(168, 85, 247, 0.2);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Soft Floating Effect for Badges */
        @keyframes floatBadge {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .float-badge { animation: floatBadge 3.5s ease-in-out infinite; }

        /* Firefly glowing light particles */
        @keyframes pulseLight {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        .firefly-glow { animation: pulseLight 4s ease-in-out infinite; }
    </style>
</head>
<body class="relative min-h-screen w-screen flex flex-col justify-between bg-park-gradient overflow-x-hidden">

    <canvas id="parkParticleCanvas" class="absolute inset-0 pointer-events-none z-0"></canvas>
    <canvas id="rainCanvas" class="absolute inset-0 pointer-events-none z-0 transition-opacity duration-700 opacity-0"></canvas>

    <!-- Park Ambient Light Blobs -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none firefly-glow"></div>
    <div class="absolute bottom-1/3 right-1/4 w-96 h-96 bg-emerald-600/20 rounded-full blur-[120px] pointer-events-none firefly-glow" style="animation-delay: 2s;"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-rose-900/20 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- Header Section -->
    <header class="relative z-10 pt-6 md:pt-8 text-center px-4">
        <div class="inline-block relative">
            <span class="cursive-font text-amber-300/80 text-2xl md:text-3xl block -mb-2">Bienvenido a</span>
            <h1 class="title-font text-4xl sm:text-5xl md:text-6xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-200 via-purple-200 to-rose-200 drop-shadow-[0_4px_10px_rgba(0,0,0,0.5)]">
                Edith's Garden
            </h1>
            <div class="h-0.5 w-3/4 mx-auto bg-gradient-to-r from-transparent via-purple-400/50 to-transparent mt-2"></div>
        </div>
        <p class="text-xs sm:text-sm text-emerald-200/80 mt-2.5 font-light tracking-widest uppercase">
            Haz clic en cada tulipán para descubrir los mensajes del alma
        </p>
    </header>

    <!-- Main Garden Display -->
    <main class="relative z-10 flex-grow flex items-end justify-center px-2 sm:px-8 pb-6 md:pb-8 max-w-7xl mx-auto w-full">
        
        <div class="grid grid-cols-3 gap-1 sm:gap-6 md:gap-12 items-end w-full max-w-5xl mx-auto">

            <!-- ================= LEFT TULIP (PENSAR) ================= -->
            <div class="flex flex-col items-center group cursor-pointer" onclick="openTulipModal('left')">
                <div class="float-badge mb-3 px-3 py-1 sm:px-5 sm:py-1.5 rounded-full bg-purple-950/70 border border-purple-400/30 text-purple-200 text-xs sm:text-sm md:text-base font-medium tracking-widest shadow-lg backdrop-blur-md group-hover:scale-110 group-hover:bg-purple-900/80 group-hover:border-purple-300 transition-all duration-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-sparkles text-purple-300 text-xs"></i>
                    <span class="title-font">Pensar</span>
                </div>

                <div class="relative tulip-sway-left w-full max-w-[120px] sm:max-w-[180px] md:max-w-[220px]">
                    <svg class="w-full h-auto glow-gradient-left transition-transform duration-500 group-hover:scale-105" viewBox="0 0 200 350" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="gradLeftOuter" x1="0%" y1="0%" x2="100%" y2="100%">

                            <linearGradient id="gradLeftInner" x1="0%" y1="0%" x2="100%" y2="100%">

                            <linearGradient id="gradLeftCenter" x1="0%" y1="0%" x2="0%" y2="100%">

            <!-- ================= CENTER TULIP (ALMA - Dark Burgundy) ================= -->

                <div class="float-badge mb-3 px-4 py-1.5 sm:px-6 sm:py-2 rounded-full bg-rose-950/80 border border-rose-500/40 text-rose-200 text-xs sm:text-sm md:text-base font-semibold tracking-widest shadow-xl backdrop-blur-md group-hover:scale-110 group-hover:bg-rose-900/90 group-hover:border-rose-400 transition-all duration-300 flex items-center gap-2">
                    <i class="fa-solid fa-heart text-rose-400 text-xs"></i>

                    <svg class="w-full h-auto glow-burgundy transition-transform duration-500 group-hover:scale-105" viewBox="0 0 200 370" fill="none" xmlns="http://www.w3.org/2000/svg">

                        <path d="M97 270 C50 260 20 215 10 170 C30 215 70 255 97 280 Z" fill="#047857" opacity="0.95"/>
                        <path d="M103 285 C150 275 180 230 190 185 C170 230 130 270 103 295 Z" fill="#059669" opacity="0.9"/>
                        <g id="centerFlowerHead" class="transition-transform duration-500 origin-bottom">
                            <path d="M100 20 C60 38 32 80 42 130 C48 158 72 175 100 175 C128 175 152 158 158 130 C168 80 140 38 100 20 Z" fill="url(#gradCenterOuter)"/>
                            <path id="centerPetalL" d="M100 25 C64 48 36 92 56 136 C70 162 90 168 100 162 C88 130 86 92 100 25 Z" fill="url(#gradCenterInner)"/>
                            <path id="centerPetalR" d="M100 25 C136 48 164 92 144 136 C130 162 110 168 100 162 C112 130 114 92 100 25 Z" fill="url(#gradCenterInner)"/>
                            <path id="centerPetalC" d="M100 20 C78 55 66 98 78 136 C88 162 100 172 100 172 C100 172 112 162 122 136 C134 98 122 55 100 20 Z" fill="url(#gradCenterCore)"/>
                        </g>
                    </svg>

            <!-- ================= RIGHT TULIP (CUERPO) ================= -->
            <div class="flex flex-col items-center group cursor-pointer" onclick="openTulipModal('right')">
                <div class="float-badge mb-3 px-3 py-1 sm:px-5 sm:py-1.5 rounded-full bg-amber-950/70 border border-amber-400/30 text-amber-200 text-xs sm:text-sm md:text-base font-medium tracking-widest shadow-lg backdrop-blur-md group-hover:scale-110 group-hover:bg-amber-900/80 group-hover:border-amber-300 transition-all duration-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-hands-holding-heart text-amber-300 text-xs"></i>
                    <span class="title-font">Cuerpo</span>
                </div>

                <div class="relative tulip-sway-right w-full max-w-[120px] sm:max-w-[180px] md:max-w-[220px]">
                    <svg class="w-full h-auto glow-gradient-right transition-transform duration-500 group-hover:scale-105" viewBox="0 0 200 350" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="gradRightOuter" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#f59e0b" />
                                <stop offset="100%" stop-color="#b91c1c" />
                            </linearGradient>
                            <linearGradient id="gradRightInner" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fbbf24" />
                                <stop offset="100%" stop-color="#ef4444" />
                            </linearGradient>
                            <linearGradient id="gradRightCenter" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#fef08a" />
                                <stop offset="100%" stop-color="#f97316" />
                            </linearGradient>
                            <linearGradient id="stemRight" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#059669" />
                                <stop offset="100%" stop-color="#022c22" />
                            </linearGradient>
                        </defs>
                        <path d="M100 150 Q110 240 100 340" stroke="url(#stemRight)" stroke-width="7" stroke-linecap="round"/>
                        <path d="M98 250 C60 240 30 200 20 160 C40 200 75 240 98 260 Z" fill="#059669" opacity="0.9"/>
                        <path d="M102 270 C140 260 170 230 180 190 C160 225 125 260 102 280 Z" fill="#10b981" opacity="0.8"/>
                        <g id="rightFlowerHead" class="transition-transform duration-500 origin-bottom">
                            <path d="M100 30 C65 45 40 85 50 130 C55 155 75 170 100 170 C125 170 145 155 150 130 C160 85 135 45 100 30 Z" fill="url(#gradRightOuter)"/>
                            <path id="rightPetalL" d="M100 35 C68 55 42 95 60 135 C72 160 90 165 100 160 C90 130 88 95 100 35 Z" fill="url(#gradRightInner)"/>
                            <path id="rightPetalR" d="M100 35 C132 55 158 95 140 135 C128 160 110 165 100 160 C110 130 112 95 100 35 Z" fill="url(#gradRightInner)"/>
                            <path id="rightPetalC" d="M100 30 C80 60 70 100 80 135 C90 160 100 168 100 168 C100 168 110 160 120 135 C130 100 120 60 100 30 Z" fill="url(#gradRightCenter)"/>
                        </g>
                    </svg>
                </div>
            </div>

        </div>
    </main>

    <!-- Interactive Control Panel Footer -->
    <footer class="relative z-20 pb-6 pt-2 text-center px-4">
        <div class="glass-panel max-w-2xl mx-auto rounded-full px-4 sm:px-6 py-2.5 sm:py-3 flex flex-wrap items-center justify-center gap-3 sm:gap-6 shadow-2xl">
            
            <!-- Rain Toggle Button -->
            <button id="rainBtn" onclick="toggleRain()" class="px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full bg-slate-800/80 hover:bg-slate-700/80 text-sky-300 border border-sky-500/30 text-xs sm:text-sm font-medium transition-all duration-300 flex items-center gap-2 transform active:scale-95">
                <i class="fa-solid fa-cloud-showers-heavy text-sky-400"></i>
                <span>Lluvia</span>
                <span id="rainBadge" class="w-2 h-2 rounded-full bg-slate-500"></span>
            </button>

            <!-- Nature Night Ambience Toggle -->
            <button id="ambientBtn" onclick="toggleAmbient()" class="px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full bg-slate-800/80 hover:bg-slate-700/80 text-emerald-300 border border-emerald-500/30 text-xs sm:text-sm font-medium transition-all duration-300 flex items-center gap-2 transform active:scale-95">
                <i class="fa-solid fa-bugs text-emerald-400"></i>
                <span>Ruido de Fondo</span>
                <span id="ambientBadge" class="w-2 h-2 rounded-full bg-slate-500"></span>
            </button>

            <!-- Celebrate Button -->
            <button onclick="triggerCelebration()" class="px-5 py-1.5 sm:px-6 sm:py-2 rounded-full bg-gradient-to-r from-amber-500 via-rose-500 to-purple-600 hover:from-amber-400 hover:via-rose-400 hover:to-purple-500 text-white font-semibold text-xs sm:text-sm tracking-wider uppercase shadow-lg shadow-rose-900/40 border border-white/20 transition-all duration-300 transform hover:scale-105 active:scale-95 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-200"></i>
                <span>¡Celebrar!</span>
            </button>

        </div>

        <div class="mt-3 text-xs text-slate-400 font-light tracking-wide">
            Edith's Garden &bull; Un espacio de afecto y calma
        </div>
    </footer>

    <!-- Message Popup Modal -->
    <div id="tulipModal" class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-950/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-500">
        <div id="modalCard" class="glass-card max-w-lg w-full rounded-2xl p-6 sm:p-8 relative transform scale-90 transition-transform duration-500 border border-purple-500/30 text-center">
            
            <!-- Close Button -->
            <button onclick="closeTulipModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <!-- Header Icon -->
            <div id="modalIconContainer" class="w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-2xl shadow-lg border">
                <i id="modalIcon" class="fa-solid fa-heart"></i>
            </div>

            <!-- Concept Label -->
            <span id="modalConcept" class="title-font uppercase tracking-widest text-xs sm:text-sm text-purple-300 block mb-2 font-bold">Concept</span>

            <!-- Main Message Text -->
            <p id="modalText" class="text-sm sm:text-base md:text-lg leading-relaxed text-slate-100 font-light italic my-4 px-2 sm:px-4">
                Message Content
            </p>

            <div class="h-0.5 w-24 mx-auto bg-gradient-to-r from-transparent via-purple-400/40 to-transparent my-5"></div>

            <!-- Action Button -->
            <button onclick="closeTulipModal()" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-purple-600 to-rose-600 hover:from-purple-500 hover:to-rose-500 text-white font-medium text-xs sm:text-sm tracking-wider uppercase shadow-lg transition-all transform hover:scale-105 active:scale-95">
                Guardar en el corazón
            </button>
        </div>
    </div>

    <script>
        // Data structure for the three flowers and their exact text messages
        const tulipData = {
            left: {
                concept: "Pensar",
                icon: "fa-sparkles",
                iconBg: "bg-purple-900/60 border-purple-400/40 text-purple-300",
                text: "Y quizas aun que aveces dude de mi mismo contigo las cosas se hacen mas pasables y mis malos ratos pasan de largo, me gusta el como eres y de cierta manera aprendi a adorar tu caos lo cual no me disgusta ya que aprendi a que no siempre se puede controlar todo y hay que dejarse llevar",
                colorBurst: ['#ec4899', '#a855f7', '#f472b6', '#ffffff']
            },
            center: {
                concept: "Alma",
                icon: "fa-heart",
                iconBg: "bg-rose-900/60 border-rose-400/40 text-rose-300",
                text: "Podria decirte lo mucho que te aprecio pero darme el tiempo para hacerte este tipo de detalles para mi que la verdad es mucho mas que cualquier otro tipo de regalo que te pueda ofrecer",
                colorBurst: ['#be123c', '#9f1239', '#f43f5e', '#fb7185', '#ffffff']
            },
            right: {
                concept: "Cuerpo",
                icon: "fa-hands-holding-heart",
                iconBg: "bg-amber-900/60 border-amber-400/40 text-amber-300",
                text: "Aunque todavia no es tu cumpleaños me gustaria felicitarte por que eres una persona increible y de la cual estoy orgulloso de haberme reencontrado, y aun que aveces dudo de merecer a alguien tan grandiosa como tu me gusta la sensacion que me da saber que te gusta estar conmigo",
                colorBurst: ['#f59e0b', '#ef4444', '#fde047', '#ffffff']
            }
        };

        // Firefly Background Canvas System
        const canvas = document.getElementById('parkParticleCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            rainCanvas.width = width;
            rainCanvas.height = height;
        });

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 50;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 0.7 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
                const colors = ['#f472b6', '#c084fc', '#34d399', '#fde047'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.01) * 0.3 + this.speedX;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const fireflies = Array.from({ length: 45 }, () => new Particle());

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            fireflies.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Web Audio API Sound Synthesizer (No external audio assets needed)
        let audioCtx = null;
        let rainNoiseNode = null;
        let rainGain = null;
        let ambientGain = null;
        let ambientInterval = null;
        let isRainActive = false;
        let isAmbientActive = false;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Synthesize Realistic Soft Rain Audio
        function startRainAudio() {
            initAudioContext();
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            
            // Pink/brownish soft noise generation
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                output[i] *= 0.03;
                b6 = white * 0.115926;
            }

            rainNoiseNode = audioCtx.createBufferSource();
            rainNoiseNode.buffer = noiseBuffer;
            rainNoiseNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);

            rainGain = audioCtx.createGain();
            rainGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            rainGain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 1.5);

            rainNoiseNode.connect(filter);
            filter.connect(rainGain);
            rainGain.connect(audioCtx.destination);
            rainNoiseNode.start();
        }

        function stopRainAudio() {
            if (rainGain && audioCtx) {
                rainGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
                setTimeout(() => {
                    if (rainNoiseNode) {
                        rainNoiseNode.stop();
                        rainNoiseNode.disconnect();
                    }
                }, 1000);
            }
        }

        // Synthesize Night Park Cricket / Frog Chirp Audio Effects
        function playChirp() {
            if (!isAmbientActive || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            const isFrog = Math.random() > 0.6;
            if (isFrog) {
                // Low pitched frog ribbit
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            } else {
                // High cricket pulse
                osc.type = 'sine';
                osc.frequency.setValueAtTime(4200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function toggleAmbient() {
            initAudioContext();
            isAmbientActive = !isAmbientActive;
            const btn = document.getElementById('ambientBtn');
            const badge = document.getElementById('ambientBadge');

            if (isAmbientActive) {
                badge.className = "w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]";
                btn.classList.add('bg-emerald-950/80', 'border-emerald-400/60');
                ambientInterval = setInterval(() => {
                    if (Math.random() > 0.3) playChirp();
                }, 800);
            } else {
                badge.className = "w-2 h-2 rounded-full bg-slate-500";
                btn.classList.remove('bg-emerald-950/80', 'border-emerald-400/60');
                clearInterval(ambientInterval);
            }
        }

        // Rain Visual Particle Canvas
        const rainCanvas = document.getElementById('rainCanvas');
        const rainCtx = rainCanvas.getContext('2d');
        rainCanvas.width = width;
        rainCanvas.height = height;

        const rainDrops = Array.from({ length: 120 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            length: Math.random() * 20 + 10,
            speed: Math.random() * 10 + 12,
            opacity: Math.random() * 0.3 + 0.1
        }));

        function animateRain() {
            if (!isRainActive) return;
            rainCtx.clearRect(0, 0, width, height);
            rainCtx.strokeStyle = 'rgba(186, 230, 253, 0.4)';
            rainCtx.lineWidth = 1.2;
            rainCtx.beginPath();
            
            rainDrops.forEach(d => {
                rainCtx.moveTo(d.x, d.y);
                rainCtx.lineTo(d.x - 2, d.y + d.length);
                d.y += d.speed;
                d.x -= 0.8;
                if (d.y > height) {
                    d.y = -20;
                    d.x = Math.random() * width;
                }
            });
            rainCtx.stroke();
            requestAnimationFrame(animateRain);
        }

        function toggleRain() {
            initAudioContext();
            isRainActive = !isRainActive;
            const btn = document.getElementById('rainBtn');
            const badge = document.getElementById('rainBadge');

            if (isRainActive) {
                badge.className = "w-2 h-2 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]";
                btn.classList.add('bg-sky-950/80', 'border-sky-400/60');
                rainCanvas.classList.remove('opacity-0');
                startRainAudio();
                animateRain();
            } else {
                badge.className = "w-2 h-2 rounded-full bg-slate-500";
                btn.classList.remove('bg-sky-950/80', 'border-sky-400/60');
                rainCanvas.classList.add('opacity-0');
                stopRainAudio();
            }
        }

        // Celebrate Fireworks / Confetti Trigger
        function triggerCelebration() {
            initAudioContext();
            
            // Multi-stage confetti burst
            const count = 200;
            const defaults = {
                origin: { y: 0.7 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#f43f5e', '#ec4899'] });
            fire(0.2, { spread: 60, colors: ['#fde047', '#a855f7'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8, colors: ['#34d399', '#38bdf8'] });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2, colors: ['#ffffff', '#f59e0b'] });

            // Create gentle flower pulse bloom
            ['left', 'center', 'right'].forEach(key => animateFlowerBloom(key));
        }

        // Modal triggers & Animations
        function openTulipModal(key) {
            const data = tulipData[key];
            if (!data) return;

            initAudioContext();
            animateFlowerBloom(key);

            document.getElementById('modalConcept').innerText = data.concept;
            document.getElementById('modalText').innerText = `"${data.text}"`;
            
            const iconContainer = document.getElementById('modalIconContainer');
            iconContainer.className = `w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-2xl shadow-lg border ${data.iconBg}`;
            document.getElementById('modalIcon').className = `fa-solid ${data.icon}`;

            createSparkleBurst(key, data.colorBurst);

            const modal = document.getElementById('tulipModal');
            const card = document.getElementById('modalCard');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        function closeTulipModal() {
            const modal = document.getElementById('tulipModal');
            const card = document.getElementById('modalCard');
            
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Petals Bloom Motion
        function animateFlowerBloom(key) {
            const flowerHead = document.getElementById(`${key}FlowerHead`);
            const petalL = document.getElementById(`${key}PetalL`);
            const petalR = document.getElementById(`${key}PetalR`);

            if (flowerHead && petalL && petalR) {
                flowerHead.style.transform = 'scale(1.1) translateY(-8px)';
                petalL.style.transform = 'rotate(-12deg) translateX(-4px)';
                petalR.style.transform = 'rotate(12deg) translateX(4px)';

                setTimeout(() => {
                    flowerHead.style.transform = 'scale(1) translateY(0)';
                    petalL.style.transform = 'rotate(0deg) translateX(0)';
                    petalR.style.transform = 'rotate(0deg) translateX(0)';
                }, 800);
            }
        }

        // Sparkle FX Burst
        function createSparkleBurst(key, colors) {
            const elements = {
                left: document.querySelector('.tulip-sway-left'),
                center: document.querySelector('.tulip-sway-center'),
                right: document.querySelector('.tulip-sway-right')
            };

            const target = elements[key];
            if (!target) return;

            const rect = target.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 3;

            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'fixed w-2.5 h-2.5 rounded-full pointer-events-none z-50';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = `${centerX}px`;
                p.style.top = `${centerY}px`;
                p.style.boxShadow = `0 0 10px ${p.style.backgroundColor}`;
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 120 + 30;
                const duration = Math.random() * 700 + 400;

                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0)`, opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
                }).onfinish = () => p.remove();
            }
        }
    </script>
